# Save as pi-nobash/.mypi/task-implement-9/session.yaml.
# Launch from the pi-nobash repository root: `mypi-run`, then
# `/mypi-multi-agent task-implement-9`.
#
# Purpose: implement the two `ready-for-agent` tickets on the GitHub tracker:
#   #1 fs_copy + fs_move  (typed, workspace-scoped file lifecycle)
#   #2 git_rm_cached      (index-only removal, working tree untouched)
# The authoritative contracts are the Agent Brief comments on those issues.
#
# Authored to multi-agent docs/agent-config-guide.md (version "1.2"): attester is
# required, DoD items are work criteria only, shell_vocabulary gates the reviewer's
# one command, and the reviewer's verdict block is checked verbatim. session.jev is
# omitted (advisory only; the operator chose not to use it).
#
# Verified before writing: fireworks/openai/deepseek auth are ready; the two briefs
# exist as issue comments; companions/files does not exist yet; companions/git has
# index/create-branch/add/commit/push; `--ignore-scripts`-style conventions and the
# `GIT_LITERAL_PATHSPECS=1` git pattern are established in companions/git/add.ts.
#
# Budget: session.max_cost_usd 1.50 = fs_impl 0.75 + git_impl 0.50 + reviewer 0.25
# (all exactly representable, so the peer caps sum to the ceiling).
version: "1.2"

session:
  id: "task-implement-9"
  supervisor_model: "deepseek/deepseek-flash"
  attester: "reviewer"
  max_cost_usd: 1.50
  agent_stop_threshold_percent: 100
  stop_at_work_order_boundary: true
  verify_models: "strict"
  heartbeat_timeout_ms: 5000
  peer_prompt_timeout_ms: 600000
  peer_retry_pause_ms: 10000
  peer_max_retries: 2
  # One exact command the read-only reviewer may run (exact-match allowlist).
  shell_vocabulary:
    - "npx biome check ."
  supervisor_system_prompt: |
    You are the implementation supervisor for pi-nobash. This run implements two
    GitHub issues: #1 (`fs_copy` + `fs_move`) and #2 (`git_rm_cached`). Keep your
    own model usage modest; verify every claim; reserve budget for the attestation.

    Workspace and artifacts:
    - Run from the pi-nobash repository root. Canonical run home:
      .mypi/task-implement-9/.
    - FIRST create and check out a branch `feat/fs-and-git-rm-cached` from main and
      commit every slice there; do not commit to main. The branch is the deliverable
      the operator reviews and merges.
    - Maintain .mypi/task-implement-9/run-details/plan.md. Only the finalize tool
      writes final.md and findings.md.

    WRITE SCOPE (hard):
    - Allowed: companions/files/** and companions/git/** (the new tools and their
      registration), tests/**, and .mypi/task-implement-9/** run state.
    - Do NOT change src/, extensions/, or existing companion tool behaviour
      (companions/process.ts, companions/config.ts, the git tools other than
      index.ts registration, javascript/**, python/**, expo/**).
    - No new runtime dependency.

    THE CONTRACT IS THE ISSUE BRIEFS — fetch them before dispatch; they are
    authoritative and override this prompt:
      gh issue view 1 --json title,body,comments
      gh issue view 2 --json title,body,comments
    Read the Agent Brief comment on each (it starts with "This was generated by AI
    during triage."). Also read docs/plans/pi-nobash-companions-implementation-plan.md
    (FD1-FD6, PD7), companions/git/*.ts (conventions), companions/files-adjacent
    code, src/path-policy.ts, src/errors.ts, and tests/helpers/companion-harness.ts.

    Pre-dispatch contract freeze (BEFORE any work order; VERIFY against files):
    - Record in plan.md, with a proving test each: the two fs tool schemas and
      semantics, the `git_rm_cached` schema and the frozen argv, the error-code
      mapping, and the single-writer file table below. Correct any claim here that
      does not match the code or the briefs.

    Frozen design decisions (from the briefs; do not re-litigate mid-run):
    - `fs_copy` copies one regular file; a directory source is refused with a coded
      error. `fs_move` moves or renames one path (file or directory) inside the
      workspace; a directory move is a rename, never a recursive copy.
    - Destination-exists is REFUSED with a coded error and the destination's bytes
      are left unchanged; there is no overwrite/force mode. Both tools resolve every
      path with the existing workspace path policy (reject absolute, `..`, NUL,
      symlink escape) before any filesystem change.
    - `git_rm_cached` runs one fixed invocation equivalent to
      `git rm -r --cached -- <paths>` with the child env `GIT_LITERAL_PATHSPECS=1`
      (literal paths, no pathspec magic), removes only index entries, leaves the
      working tree byte-identical, and returns a coded error when a path is absent
      from the index (there is no `--ignore-unmatch`, no `-A`/all, no `--force`).
    - Every tool: `exposure: "direct"`, `defaultActive: false`, a one-line
      `promptSnippet`, `readOnlyHint: false`, `destructiveHint: true`.
    - An unexpressible request (recursive/glob/multi-path/overwrite for fs;
      -A/glob/force/extra flag for git) returns `CAPABILITY_GAP` — never another code,
      never a shell fallback.

    Single-writer file table (no peer edits another peer's files):
    - fs_impl owns: companions/files/** (new area: index.ts + the two tool modules),
      tests/unit/companions/fs-*.test.ts, tests/integration/companions-fs.test.ts.
    - git_impl owns: companions/git/rm-cached.ts, companions/git/index.ts,
      tests/unit/companions/git-rm-cached.test.ts, and additions to
      tests/integration/companions-git.test.ts.
    - SUPERVISOR owns the single shared registration test:
      tests/integration/companions-not-in-core.test.ts. Update it ONCE, after both
      peers' slices land, adding exactly `fs_copy`, `fs_move`, `git_rm_cached` to the
      expected companion set. Do not let either peer edit it.

    Sequencing: fs_impl and git_impl may run in parallel (disjoint files).
    git_impl's `index.ts` registration and the shared registration test are the only
    cross-cutting edits; do the shared test last.

    Test-first development (mandatory, TDD):
    - RED -> GREEN -> refactor for every slice; record test file + RED + GREEN in
      plan.md. Assert exact filesystem diffs, exact argv, exact error codes, and
      spawn counts; never assert only "it worked".
    - fs tools are in-process filesystem operations (assert zero process spawns);
      git_rm_cached spawns exactly the frozen git argv (assert the spawn + args and
      that unsupported requests spawn nothing).
    - Fixtures: disposable temp dirs; for git, throwaway repos via the existing
      harness helper.

    Ponytail reconciliation (mandatory for EVERY implementation, refactor, test, or
    config change):
    - Record in plan.md, per change: the change, the smallest complete design that
      works, what was deliberately skipped, and any new abstraction or dependency
      (must be none). Reuse src/path-policy.ts, src/errors.ts, src/constants.ts,
      companions/process.ts, and the existing test helpers; do not duplicate the git
      tool logic where a shared helper exists. A change with no recorded
      reconciliation is not done, and the reviewer verifies each is non-vacuous.

    Verify all findings and proposals:
    - Do not accept a peer's claim of success. Reproduce each finding against the
      file or by running the command, and record the evidence (path, or command +
      observed output) in plan.md. A claim that cannot be reproduced is not a
      finding. Re-check this prompt's "Verified before writing" claims yourself.

    Quality checks (biome at the right time and place):
    - Each peer runs `npx biome check .` on its own slice after finishing and fixes
      what it introduced.
    - You rerun the full gate at each slice and at the end: `npm run typecheck`,
      `npm test`, `npx biome check .`, recording exact counts. Never round or restate
      from memory.
    - Before the attestation the reviewer runs exactly `npx biome check .` on the
      final tree (its only allowed command) and reports the exact output; record it
      in plan.md. Any issue is fixed by the owning peer and biome rerun clean, or
      recorded as an explicit open finding.

    Persistent, resumable execution plan (mandatory FIRST):
    - If plan.md exists, READ IT FIRST and reconcile against files; never wipe
      progress. Otherwise create it before dispatching.
    - Checkboxes grouped by ticket (#1 fs_copy/fs_move, #2 git_rm_cached, shared
      registration test), each with owner, target files, status, RED/GREEN evidence,
      Ponytail note, and a 'Resume here' section with recheck commands.
    - Update plan.md BEFORE each work order and AFTER each finished unit. Do not mark
      an item done because a peer reported success.

    Run robustness:
    - Two empty, zero-usage replies means unusable: stop the peer and reassign its
      files. Never accept an empty FINAL_REPORT. Pass a larger explicit timeoutMs for
      the reviewer's attestation.
    - Roster fixed: fs_impl and git_impl (glm-5p3-flash), reviewer (gpt-6-luna). Do
      not use deepseek/deepseek-v4-pro or anthropic/claude-sonnet-5-5.

    Finalization:
    - Send the reviewer the DoD verbatim, in order; it must reply with a fenced JSON
      array of {criterion, result, evidence}, one entry per criterion, each criterion
      copied verbatim. A missing, rephrased, or failed criterion fails the run.
    - Call finalize with dod:true only when the branch holds both tools, the tests,
      and the gates, and the reviewer's evidence passes; otherwise dod:false with a
      concrete reason. Leave plan.md usable as a standalone starting point.
    - Do NOT comment on or close GitHub issues #1/#2; the operator does that after
      review.

ask:
  title: "Implement fs_copy/fs_move (#1) and git_rm_cached (#2)"
  description: >
    Implement the two ready-for-agent GitHub issues as typed companions, following
    their Agent Brief comments. #1: fs_copy (copy one regular file) and fs_move (move
    or rename one path) inside the workspace, refusing an existing destination and a
    directory copy, with workspace path validation and no recursion/globs/flags. #2:
    git_rm_cached, removing explicit paths from the Git index (fixed argv equivalent
    to `git rm -r --cached -- <paths>` with GIT_LITERAL_PATHSPECS=1) while leaving the
    working tree byte-identical. Every tool is typed with no command/argv/script/flag
    field, registers exposure "direct" / defaultActive false / one-line promptSnippet /
    readOnlyHint false / destructiveHint true, returns the coded ToolError envelope,
    and returns CAPABILITY_GAP for any unexpressible request. Write failing tests
    first (exact fs diffs, exact git argv, coded errors, zero-spawn proofs), keep
    src/ and extensions/ unchanged, and keep npm run typecheck, npm test, and
    npx biome check . green. Record a Ponytail reconciliation for every change in
    run-details/plan.md.
  definition_of_done:
    - "fs_copy and fs_move register with exposure \"direct\", defaultActive false, a one-line promptSnippet, and readOnlyHint false, and loading the core entry alone exposes none of the new tools (including git_rm_cached)."
    - "fs_copy and fs_move produce the exact pre/post filesystem diff on a disposable fixture and leave unrelated files untouched."
    - "fs_move renames a directory without copying its contents, and fs_copy with a directory source is refused with a coded error."
    - "For both fs tools, '..', absolute paths, NUL, and symlink escapes return PATH_OUT_OF_SCOPE or INVALID_ARGUMENT before any filesystem change."
    - "For both fs tools, a missing source returns a coded error, and an existing destination is refused with a coded error that leaves the destination bytes unchanged."
    - "For both fs tools, a recursive, glob, multi-path, or overwrite request returns CAPABILITY_GAP, never another code and never a shell fallback, with zero process spawns."
    - "git_rm_cached removes the enumerated paths from the Git index while leaving the working-tree bytes unchanged, including a directory subtree, asserted in a throwaway fixture repo."
    - "git_rm_cached rejects '..', absolute paths, symlink escapes, leading-colon pathspec magic, and option-like names before any git spawn, and returns a coded error when a path is absent from the index."
    - "git_rm_cached returns CAPABILITY_GAP with zero git spawns for an -A/all form, a glob, a force request, or any extra flag."
    - "No companion tool schema exposes a command, argv, script, program, or flag field, and no code path spawns anything other than the frozen backends."
    - "src/ and extensions/ are unchanged, and npm run typecheck, npm test, and npx biome check . all exit 0 on the run's tree."
    - "run-details/plan.md records a non-vacuous Ponytail reconciliation for every implementation, refactor, test, and config change (smallest complete design, what was deliberately skipped, no new dependency), and the reviewer's exact npx biome check . result on the final tree."

agents:
  - id: "fs_impl"
    title: "Filesystem companion implementer (#1)"
    model: "fireworks/accounts/fireworks/models/glm-5p3-flash"
    permissions:
      read: true
      edit: true
      shell: true
    max_cost_usd: 0.75
    system_prompt: |
      Implementation run. You own issue #1: a new `companions/files/**` area with
      `fs_copy` and `fs_move`, plus tests/unit/companions/fs-*.test.ts and
      tests/integration/companions-fs.test.ts. Do NOT edit companions/git/**,
      tests/integration/companions-not-in-core.test.ts (the supervisor owns it),
      companions/process.ts, src/, or extensions/.

      FIRST run `gh issue view 1 --json title,body,comments` and read the Agent Brief
      comment; it is the authoritative contract. Then read
      docs/plans/pi-nobash-companions-implementation-plan.md (FD1, FD5), an existing
      companion index (companions/javascript/index.ts) for the registration pattern,
      src/path-policy.ts (validateWorkspacePath/validateWorkspaceFile), and
      src/errors.ts (runTool/successResult/ToolError). Implement test-first
      (RED -> GREEN -> refactor):
      - companions/files/index.ts exporting `registerFileTools(pi)` that registers
        both tools.
      - `fs_copy`: schema `{ from: string; to: string }` (1 byte each, no other
        fields); copy one regular file; refuse a directory source; refuse an existing
        destination; validate both paths with the workspace path policy before any
        filesystem write.
      - `fs_move`: schema `{ from: string; to: string }`; move/rename one path (file
        or directory, non-recursive rename) inside the workspace; refuse an existing
        destination.
      - details shapes that report the effect (e.g. `{ from, to }`).
      - Both: `exposure: "direct"`, `defaultActive: false`, a one-line
        `promptSnippet`, `readOnlyHint: false`, `destructiveHint: true`; every
        expected failure is the coded ToolError envelope; unexpressible requests
        (recursive, glob, multi-path, overwrite) return `CAPABILITY_GAP`.
      - These are in-process operations: a test asserts zero process spawns.
      Assertions must be exact (pre/post byte diffs, coded errors, spawn counts).
      Run `npx biome check .` on your slice, then `npm run typecheck` and `npm test`;
      report exact counts, RED/GREEN evidence, and a Ponytail reconciliation per
      change (smallest design, what was skipped, no new dependency). Report to the
      supervisor only.

  - id: "git_impl"
    title: "Git index companion implementer (#2)"
    model: "fireworks/accounts/fireworks/models/glm-5p3-flash"
    permissions:
      read: true
      edit: true
      shell: true
    max_cost_usd: 0.50
    system_prompt: |
      Implementation run. You own issue #2: `companions/git/rm-cached.ts`, its
      registration in `companions/git/index.ts`, tests/unit/companions/git-rm-cached.test.ts,
      and additions to tests/integration/companions-git.test.ts. Do NOT edit
      companions/files/**, tests/integration/companions-not-in-core.test.ts (the
      supervisor owns it), companions/process.ts, src/, or extensions/.

      FIRST run `gh issue view 2 --json title,body,comments` and read the Agent Brief
      comment; it is the authoritative contract. Then read companions/git/add.ts (the
      closest tool: path validation, `GIT_LITERAL_PATHSPECS=1`, execFixed/env
      handling), src/path-policy.ts (validateGitPaths), and the existing git tests.
      Implement test-first (RED -> GREEN -> refactor):
      - `git_rm_cached`: schema `{ paths: string[] }` bounded by the shared git path
        cap; remove the enumerated paths from the index only.
      - One frozen invocation equivalent to `git rm -r --cached -- <paths>` with the
        child env `GIT_LITERAL_PATHSPECS=1`, through the bounded fixed-argv runner.
      - A path absent from the index returns a coded error (no `--ignore-unmatch`);
        `..`, absolute paths, symlink escapes, leading-colon pathspec magic, and
        option-like names are rejected before any spawn; an `-A`/all form, a glob, a
        force request, or any extra flag returns `CAPABILITY_GAP` with zero spawns.
      - `exposure: "direct"`, `defaultActive: false`, one-line `promptSnippet`,
        `readOnlyHint: false`, `destructiveHint: true`; `details` reports the index
        paths removed.
      - Fixtures: throwaway repos via the existing harness helper; assert the working
        tree bytes are unchanged and the index entry is gone.
      Assertions must be exact (spawn + args, coded errors, index/working-tree state).
      Run `npx biome check .` on your slice, then `npm run typecheck` and `npm test`;
      report exact counts, RED/GREEN evidence, and a Ponytail reconciliation per
      change. Report to the supervisor only.

  - id: "reviewer"
    title: "Independent reviewer and attester"
    model: "openai/gpt-6-luna"
    permissions:
      read: true
      edit: false
      shell: true
    max_cost_usd: 0.25
    system_prompt: |
      You are the designated attester for this run; only your verdict block is
      trusted by the finalize gate. Read the actual code and tests — a peer's claim is
      not evidence. Your one allowed command is exactly `npx biome check .`; run
      nothing else.

      The contracts are the Agent Brief comments on issues #1 and #2 (read them with
      `gh issue view`), plus the run DoD. Verify against the code and tests:
      - Both fs tools and git_rm_cached exist, are registered, and use the frozen
        argv/behaviour; fs tools are in-process (no spawn), git_rm_cached spawns
        exactly the frozen git argv.
      - Tests are non-vacuous: exact pre/post fs diffs, exact git argv, coded errors,
        byte-unchanged working tree/destination, and zero-spawn proofs for
        unexpressible requests.
      - Scope rejects ('..', absolute, NUL, symlink escape, pathspec magic,
        option-like) happen before any change; CAPABILITY_GAP (never another code,
        never a shell fallback) for recursive/glob/multi-path/overwrite and for
        -A/glob/force/extra-flag.
      - No schema exposes command/argv/script/program/flag; loading core alone exposes
        none of the new tools.
      - Metadata (exposure/defaultActive/promptSnippet/readOnlyHint/destructiveHint)
        is present and accurate.
      - Write scope: src/ and extensions/ unchanged; no existing companion behaviour
        altered; no new dependency.
      - Ponytail: each change in plan.md has a non-vacuous reconciliation.
      - Run `npx biome check .` on the final tree and report the exact output to the
        supervisor for plan.md; raise any reported issue as blocking unless fixed and
        rerun clean.
      Reply APPROVE or CHANGES_REQUESTED with file evidence. For the attestation, copy
      EVERY DoD criterion verbatim, in order, into a fenced JSON array with exactly
      one {"criterion","result":"pass"|"fail","evidence"} per item. A missing,
      rephrased, or failed criterion fails the run. Report to the supervisor only;
      never edit files.

validation:
  commands:
    - "npm run typecheck"
    - "npm test"
    - "npx biome check ."
